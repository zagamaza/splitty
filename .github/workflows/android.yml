name: Android

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'

jobs:
  build:
    name: Build & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android

    steps:
      - uses: actions/checkout@v4

      # JDK 21: Robolectric 4.13 не работает на JDK 24, а сборке 21 достаточно
      # (compileOptions/jvmTarget проекта — 17).
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      # -Proborazzi.test.verify=true обязателен: без него Roborazzi по умолчанию
      # РАБОТАЕТ В РЕЖИМЕ ЗАПИСИ и перезаписывает версионируемые эталоны
      # (app/src/test/snapshots) прямо перед сверкой — verifyRoborazzi ниже
      # сравнивал бы их сам с собой и всегда был зелёным.
      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest -Proborazzi.test.verify=true

      # Скриншот-тесты: 23 эталона версионируются в app/src/test/snapshots и
      # сверяются попиксельно. Сверка с iOS-снапшотами остаётся ручной (Task 15).
      - name: Roborazzi
        run: ./gradlew :app:verifyRoborazziDebug

      # Без картинок расхождения «снимок не совпал» — это тупик: в логе только
      # AssertionError, а чем именно отличается — не видно. Выкладываем их,
      # чтобы падение можно было разобрать, а не гадать.
      - name: Отчёты о расхождениях
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: roborazzi-и-отчёты-тестов
          if-no-files-found: ignore
          retention-days: 7
          path: |
            android/app/build/outputs/roborazzi/**
            android/app/build/reports/tests/**
            android/app/build/test-results/**

      # Страховка от случайной перезаписи эталонов: если шаг выше их изменил,
      # значит сверка шла не с тем, что лежит в репозитории.
      - name: Snapshots unchanged
        run: git diff --exit-code -- app/src/test/snapshots

      - name: Lint
        run: ./gradlew :app:lintDebug

      - name: Assemble debug
        run: ./gradlew :app:assembleDebug

      # Release-сборка гоняет R8 и verifyReleaseShrinking: без этого шага
      # «выкинутый сериализатор» всплывёт только у тестера в рантайме.
      - name: Assemble release (R8 smoke)
        run: ./gradlew :app:assembleRelease

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: |
            android/app/build/reports/
            android/app/build/outputs/roborazzi/
