name: Splitty
options:
  bundleIdPrefix: com.zagir
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk.git
    from: "11.0.0"
  # Вход через Google (LoginView → POST /api/v1/auth/google). SDK нужен ровно
  # ради одной вещи — получить подписанный Google id-токен; дальше работает наш
  # бэкенд, который сам сверяет подпись по JWKS (internal/oidc).
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: "8.0.0"
targets:
  Splitty:
    type: application
    platform: iOS
    sources:
      # Splitty/Localizable.xcstrings попадает в ресурсы отсюда же: каталог
      # лежит внутри папки таргета, отдельной строки не нужно. Ключ каталога —
      # русский исходный текст (CFBundleDevelopmentRegion: ru), переводы —
      # en/es/de/fr, формулировки согласованы с android/values-*/strings.xml.
      #
      # Список ключей, которые реально просит код, снимается сборкой:
      #   xcodebuild ... SWIFT_EMIT_LOC_STRINGS=YES
      # и лежит в Objects-normal/<arch>/*.stringsdata.
      - Splitty
    dependencies:
      # Только Messaging: тянет FirebaseCore транзитивно, без Analytics и пр.
      - package: Firebase
        product: FirebaseMessaging
      # Только GoogleSignIn: GoogleSignInSwift не берём — кнопка своя,
      # в оформлении экрана входа (.primaryPill/.softChip).
      - package: GoogleSignIn
        product: GoogleSignIn
    entitlements:
      path: Splitty/Splitty.entitlements
      properties:
        # Окружение APNs подставляется из build-setting APS_ENVIRONMENT (ниже):
        # Debug → development (sandbox, запуск из Xcode), Release → production
        # (TestFlight/App Store). Xcode раскрывает $(...) в entitlements при
        # подписи. Один и тот же .p8 в Firebase залит в обе строки (dev+prod).
        aps-environment: $(APS_ENVIRONMENT)
        # Sign in with Apple (LoginView → POST /api/v1/auth/apple).
        # Default — обычный вход по Apple ID. Capability обязана быть включена
        # в Apple Developer для com.zagir.splitty, иначе подпись падает на
        # «provisioning profile doesn't support Sign in with Apple».
        com.apple.developer.applesignin:
          - Default
        # Universal links: страница приглашения https://<domain>/join/<roomId>
        # (internal/rest/deeplink.go). iOS скачивает с домена
        # /.well-known/apple-app-site-association и только после этого начинает
        # уводить ссылки в приложение.
        #
        # Домен боевой: splitor.zagirnur.dev (Caddy + Let's Encrypt), тот же,
        # что PUBLIC_BASE_URL бэкенда и host в android/AndroidManifest.xml.
        # AASA отдаётся по /.well-known/apple-app-site-association как
        # application/json, без редиректов — иначе iOS его не примет.
        com.apple.developer.associated-domains:
          - applinks:splitor.zagirnur.dev
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zagir.splitty
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: 1
        DEVELOPMENT_TEAM: K8922Y6R3M
        CODE_SIGN_STYLE: Automatic
      configs:
        Debug:
          APS_ENVIRONMENT: development
        Release:
          APS_ENVIRONMENT: production
    info:
      path: Splitty/Info.plist
      properties:
        UILaunchScreen: {}
        # Тихие/фоновые push-уведомления (FCM доставляет через APNs).
        UIBackgroundModes:
          - remote-notification
        CFBundleIconName: AppIcon
        # Русский — язык исходников и запасной вариант; остальные четыре
        # ровно те же, что в android/app/src/main/res/values-*.
        CFBundleDevelopmentRegion: ru
        CFBundleLocalizations: [ru, en, es, de, fr]
        CFBundleDisplayName: Splitty
        CFBundleShortVersionString: "1.4"
        CFBundleVersion: "15"
        # Только стандартный TLS — нестандартное шифрование не используется
        ITSAppUsesNonExemptEncryption: false
        # Вход через Google. GIDClientID читается самим SDK, если
        # GIDSignIn.sharedInstance.configuration не задан кодом — держим
        # значение здесь, чтобы client id жил в одном месте с URL-схемой.
        # Это ПУБЛИЧНЫЙ идентификатор клиента, а не секрет: он всё равно
        # уезжает в каждый запрос авторизации и лежит внутри бандла.
        # Серверный (Web) client id приложению не нужен — бэкенд сверяет aud
        # сам по своему GOOGLE_CLIENT_IDS.
        GIDClientID: 327021108128-v1psnu3utn5govgn3n30h2omhvb21t1o.apps.googleusercontent.com
        # Redirect-схема Google = client id задом наперёд. Без неё
        # ASWebAuthenticationSession не сможет вернуть управление в приложение
        # и вход завершится «отменой» без единого сообщения.
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: com.zagir.splitty.google
            CFBundleURLSchemes:
              - com.googleusercontent.apps.327021108128-v1psnu3utn5govgn3n30h2omhvb21t1o
          # Кнопка «Открыть в приложении» на странице приглашения ведёт на
          # splitty://join/<roomId> (APP_SCHEME, internal/rest/deeplink.go:43).
          # Схема нужна ровно потому, что тап по ссылке НА ТОТ ЖЕ домен iOS
          # в приложение не уводит — браузер остаётся в браузере. Живёт рядом
          # с universal links (applinks: выше), а не вместо них.
          - CFBundleTypeRole: Editor
            CFBundleURLName: com.zagir.splitty.deeplink
            CFBundleURLSchemes:
              - splitty
        # Разрешения для AI-добавления расхода (голос + фото чека).
        NSMicrophoneUsageDescription: Микрофон нужен, чтобы надиктовать расход голосом. Запись уходит на сервер Splitty и в стороннюю модель для распознавания
        NSSpeechRecognitionUsageDescription: Распознавание речи показывает текст надиктовки прямо во время записи
        NSCameraUsageDescription: Камера нужна, чтобы сфотографировать чек. Снимок уходит на сервер Splitty и в стороннюю модель для распознавания
        NSPhotoLibraryUsageDescription: Доступ к фото нужен, чтобы выбрать фото чека. Снимок уходит на сервер Splitty и в стороннюю модель для распознавания
        # NSAppTransportSecurity здесь НЕТ намеренно: бэкенд на
        # https://splitor.zagirnur.dev, послаблений ATS не требуется. Не
        # возвращать NSAllowsArbitraryLoads — каждый запрос несёт
        # Authorization: Bearer с 90-дневным JWT.
  SplittyTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - SplittyTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Splitty
  SplittyUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - SplittyUITests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Splitty
    dependencies:
      - target: Splitty
schemes:
  Splitty:
    build:
      targets:
        Splitty: all
    run:
      config: Debug
    test:
      config: Debug
      # Тесты сверяют РУССКИЕ тексты (коды ошибок, конфликт выхода, приглашения),
      # а язык приложения теперь зависит от системного. Без явной локали набор
      # падал бы на симуляторе с английским языком.
      language: ru
      region: RU
      targets:
        - SplittyTests
        - SplittyUITests
