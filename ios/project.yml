name: Splitty
options:
  bundleIdPrefix: com.zagir
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  Splitty:
    type: application
    platform: iOS
    sources:
      - Splitty
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zagir.splitty
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: 1
        DEVELOPMENT_TEAM: K8922Y6R3M
        CODE_SIGN_STYLE: Automatic
    info:
      path: Splitty/Info.plist
      properties:
        UILaunchScreen: {}
        CFBundleIconName: AppIcon
        CFBundleDevelopmentRegion: ru
        CFBundleLocalizations: [ru]
        CFBundleDisplayName: Splitty
        CFBundleShortVersionString: "1.2"
        CFBundleVersion: "5"
        # Только стандартный TLS — нестандартное шифрование не используется
        ITSAppUsesNonExemptEncryption: false
        NSAppTransportSecurity:
          # Сервер доступен по http://IP:порт — исключения ATS по IP не работают,
          # поэтому для dev-сборки разрешаем произвольные HTTP-загрузки.
          # ВАЖНО: только этот ключ — при наличии более специфичных ключей
          # (NSAllowsLocalNetworking и т.п.) iOS игнорирует NSAllowsArbitraryLoads.
          NSAllowsArbitraryLoads: true
  SplittyTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - SplittyTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Splitty
  SplittyUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - SplittyUITests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Splitty
    dependencies:
      - target: Splitty
schemes:
  Splitty:
    build:
      targets:
        Splitty: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - SplittyTests
        - SplittyUITests
