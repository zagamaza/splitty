version: '3.3'
services:
  telegram-bot:
    build: .
    hostname: telegram-bot
    restart: always
    container_name: telegram-bot
    environment:
      - TG_TOKEN
      # Секрет подписи JWT обязателен: без него resolveJwtSecret валит старт
      # (log.Fatal), и с restart: always контейнер уходит в crash-loop, унося
      # заодно telegram-бота. Берётся из окружения хоста (как TG_TOKEN).
      - API_JWT_SECRET
      # Дефолт LISTEN — localhost:7171, то есть сокет на loopback контейнера:
      # снаружи он недоступен ни через какой проброс портов. Слушаем 0.0.0.0.
      - LISTEN=0.0.0.0:7171
      # info, а не debug: на debug в лог уходили тела входящих сообщений —
      # имена, суммы и текст переписки людей. Разбор инцидента поднимает
      # уровень руками и опускает обратно
      - LOG_LEVEL=info
      # Строка подключения. С заданными MONGO_USER/MONGO_PASSWORD она обязана
      # содержать их же — иначе mongo с включённой авторизацией отвергнет
      # приложение, и оно уйдёт в перезапуск
      - DB_HOST=${DB_HOST:-mongodb://mongo:27017/}
      - LOG_FMT=json
      # AI-распознавание расхода. Секрет берётся из окружения хоста (как TG_TOKEN),
      # в файл не коммитится. Пустой ключ → фича выключена (/parse отдаёт 503).
      - GEMINI_API_KEY
      - GEMINI_MODEL
      # Напоминания о невозвращённом долге: off (по умолчанию) | dry | on.
      # dry считает и пишет в лог агрегаты, ничего не отправляя — им и
      # проверяют охват на живых данных перед включением
      - DEBT_REMINDERS
      - DEBT_REMINDERS_HOUR
      # Метрики Prometheus. Слушатель отдельный и наружу НЕ публикуется:
      # до него дотягивается только сборщик по сети docker
      - METRICS_LISTEN=:18003
      - METRICS_INTERVAL
      # FCM push: путь к service-account JSON Firebase Admin ВНУТРИ контейнера.
      # Файл монтируется ниже с хоста (сам секрет в git не коммитится — см.
      # .gitignore). Отсутствует/битый — сервер стартует, пуши просто выключены
      # (NewWorker → log.Warn, не fatal).
      - FIREBASE_CREDENTIALS_FILE=/app/firebase-service-account.json
      # ⚠️ Всё, что ниже, ОБЯЗАНО быть перечислено здесь поимённо. compose
      # пробрасывает в контейнер только названные переменные — переменная,
      # лежащая в .env на сервере, но не упомянутая в этом списке, до процесса
      # НЕ ДОЕДЕТ (TG_TOKEN и API_JWT_SECRET работают именно потому, что они
      # здесь есть). Пустое значение везде означает «способ выключен».
      #
      # Ревью App Store: многоразовый код входа и id демо-аккаунта.
      - REVIEW_LOGIN_CODE
      - REVIEW_USER_ID
      # Вход через Google/Apple. APPLE_PRIVATE_KEY — СОДЕРЖИМОЕ .p8 (многострочное,
      # в .env кавычится), нужен обмену authorizationCode и отзыву токенов.
      - GOOGLE_CLIENT_IDS
      - APPLE_CLIENT_IDS
      - APPLE_TEAM_ID
      - APPLE_KEY_ID
      - APPLE_PRIVATE_KEY
      # Диплинк-вход в группу. PUBLIC_BASE_URL — выключатель всей фичи.
      - PUBLIC_BASE_URL
      - IOS_APP_ID
      - ANDROID_PACKAGE
      - ANDROID_CERT_SHA256
      - IOS_STORE_URL
      # Сколько обратных прокси стоит перед сервером. 0 — прямые соединения
      # (текущий деплой): X-Forwarded-For не читается, лимиты по RemoteAddr.
      # Отсечка по дате выпуска токена (RFC3339). Пусто — выключена.
      # ⚠️ Включение разлогинивает всех, кто вошёл раньше указанной даты
      - TOKEN_MIN_ISSUED_AT
      - TRUSTED_PROXY_COUNT
      # Адреса/подсети реверс-прокси через запятую. Пусто — петля и приватные
      # диапазоны: заголовку X-Forwarded-For из интернета не верим никогда
      - TRUSTED_PROXIES
      # Подписка Splitor Plus. Пустые ключи = покупки выключены: эндпоинты
      # подписки отдают 503, все считаются бесплатными, остальной сервер
      # работает как раньше.
      #
      # ⚠️ APPLE_IAP_KEY_ID — ключ In-App Purchase, ОТДЕЛЬНЫЙ и от ключа
      # выкладки сборок, и от APPLE_KEY_ID для Sign in with Apple.
      # APPLE_IAP_PRIVATE_KEY — содержимое .p8 (многострочное, в .env
      # кавычится), не путь.
      - APPLE_IAP_ISSUER_ID
      - APPLE_IAP_KEY_ID
      - APPLE_IAP_PRIVATE_KEY
      - APPLE_IAP_BUNDLE_ID
      - GOOGLE_PLAY_SA_JSON
      - GOOGLE_PLAY_PACKAGE
      # Суточный лимит распознаваний. LEGACY — для сборок, которые про экран
      # оплаты ещё не знают: обрезать их до пяти значит сломать работающее.
      - AI_FREE_DAILY_QUOTA
      - AI_PLUS_DAILY_QUOTA
      - AI_LEGACY_DAILY_QUOTA
      # Plus без покупки: владелец проекта и демо-аккаунт ревьюера магазина.
      - PLUS_COMP_USER_IDS
      - PLUS_PRODUCT_IDS
      - PLUS_DELIVERY_SLACK
      - PLUS_TIER_CACHE_TTL
      # Какие чеки принимает прод. Только Production: sandbox-подписки
      # бесплатны и продлеваются каждые несколько минут — то есть дали бы
      # вечный Plus даром.
      - STORE_ALLOWED_ENVIRONMENT
      # Админский API: панель admin.zagirnur.dev читает через него комнаты,
      # людей и продуктовые агрегаты. Слушатель наружу не публикуется, до него
      # дотягивается только соседний контейнер по сети docker. Пустой токен
      # выключает его целиком — значения по умолчанию у токена нет и быть
      # не может.
      #
      # ⚠️ Без этих двух строк слушатель не поднимается ВООБЩЕ: переменная,
      # лежащая в .env, но не названная здесь, до процесса не доедет.
      - ADMIN_API_LISTEN
      - ADMIN_API_TOKEN
      # Приём продуктовых событий от клиентов. Пусто = включено: см. config.go,
      # дефолт «выключено» неотличим от честного «данных пока нет».
      - ANALYTICS_ENABLED
    volumes:
      # Секрет кладётся рядом с docker-compose.yml на хосте и монтируется ro.
      - ./firebase-service-account.json:/app/firebase-service-account.json:ro
    ports:
      - "18001:7171"

  mongo:
    # Тег зафиксирован намеренно: с `image: mongo` (то есть latest) команда
    # `docker compose up -d mongo` на машине без сети падает на попытке стянуть
    # latest, хотя локально уже лежит образ mongo:7 — ровно в тот момент, когда
    # она нужна (поднять базу под интеграционные тесты репозитория).
    image: mongo:7
    restart: always
    ports:
      # Порт привязан к петле, а не к 0.0.0.0: приложение ходит в базу по
      # внутренней сети compose, а снаружи ей делать нечего. Совсем убирать
      # публикацию нельзя — интеграционные тесты репозитория подключаются к
      # localhost:27017, и без порта они не падают, а МОЛЧА скипаются
      - "127.0.0.1:27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=splitty
      # Пароль базы. Пусто — mongo стартует без авторизации (так было всегда):
      # включение требует согласованной смены DB_HOST, поэтому делается
      # отдельным шагом, а не в общей волне
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_USER:-}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASSWORD:-}
    volumes:
      - ./mongo/data:/data/db
