version: '3.3'
services:
  telegram-bot:
    build: .
    hostname: telegram-bot
    restart: always
    container_name: telegram-bot
    environment:
      - TG_TOKEN
      # Секрет подписи JWT обязателен: без него resolveJwtSecret валит старт
      # (log.Fatal), и с restart: always контейнер уходит в crash-loop, унося
      # заодно telegram-бота. Берётся из окружения хоста (как TG_TOKEN).
      - API_JWT_SECRET
      # Дефолт LISTEN — localhost:7171, то есть сокет на loopback контейнера:
      # снаружи он недоступен ни через какой проброс портов. Слушаем 0.0.0.0.
      - LISTEN=0.0.0.0:7171
      - LOG_LEVEL=debug
      - DB_HOST=mongodb://mongo:27017/
      - LOG_FMT=json
      # AI-распознавание расхода. Секрет берётся из окружения хоста (как TG_TOKEN),
      # в файл не коммитится. Пустой ключ → фича выключена (/parse отдаёт 503).
      - GEMINI_API_KEY
      - GEMINI_MODEL
      # FCM push: путь к service-account JSON Firebase Admin ВНУТРИ контейнера.
      # Файл монтируется ниже с хоста (сам секрет в git не коммитится — см.
      # .gitignore). Отсутствует/битый — сервер стартует, пуши просто выключены
      # (NewWorker → log.Warn, не fatal).
      - FIREBASE_CREDENTIALS_FILE=/app/firebase-service-account.json
      # ⚠️ Всё, что ниже, ОБЯЗАНО быть перечислено здесь поимённо. compose
      # пробрасывает в контейнер только названные переменные — переменная,
      # лежащая в .env на сервере, но не упомянутая в этом списке, до процесса
      # НЕ ДОЕДЕТ (TG_TOKEN и API_JWT_SECRET работают именно потому, что они
      # здесь есть). Пустое значение везде означает «способ выключен».
      #
      # Ревью App Store: многоразовый код входа и id демо-аккаунта.
      - REVIEW_LOGIN_CODE
      - REVIEW_USER_ID
      # Вход через Google/Apple. APPLE_PRIVATE_KEY — СОДЕРЖИМОЕ .p8 (многострочное,
      # в .env кавычится), нужен обмену authorizationCode и отзыву токенов.
      - GOOGLE_CLIENT_IDS
      - APPLE_CLIENT_IDS
      - APPLE_TEAM_ID
      - APPLE_KEY_ID
      - APPLE_PRIVATE_KEY
      # Диплинк-вход в группу. PUBLIC_BASE_URL — выключатель всей фичи.
      - PUBLIC_BASE_URL
      - IOS_APP_ID
      - ANDROID_PACKAGE
      - ANDROID_CERT_SHA256
      - IOS_STORE_URL
      # Сколько обратных прокси стоит перед сервером. 0 — прямые соединения
      # (текущий деплой): X-Forwarded-For не читается, лимиты по RemoteAddr.
      - TRUSTED_PROXY_COUNT
    volumes:
      # Секрет кладётся рядом с docker-compose.yml на хосте и монтируется ro.
      - ./firebase-service-account.json:/app/firebase-service-account.json:ro
    ports:
      - "18001:7171"

  mongo:
    # Тег зафиксирован намеренно: с `image: mongo` (то есть latest) команда
    # `docker compose up -d mongo` на машине без сети падает на попытке стянуть
    # latest, хотя локально уже лежит образ mongo:7 — ровно в тот момент, когда
    # она нужна (поднять базу под интеграционные тесты репозитория).
    image: mongo:7
    restart: always
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=splitty
    volumes:
      - ./mongo/data:/data/db
